<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lowe's Interactive Store Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="topbar">
        <div class="brand">Lowe's Store Map</div>
        <select id="store-select"></select>
        <div id="store-meta"></div>
        <button id="debug-toggle" title="Live-adjust the raw GeoJSON floor plan and copy the result">Debug</button>
    </div>

    <div id="map"></div>

    <div id="layer-panel">
        <h3>Layers</h3>
        <label class="layer-row"><input type="checkbox" id="layer-satellite" /> Satellite basemap</label>
        <label class="layer-row"><input type="checkbox" id="layer-building" checked /> Building footprint</label>
        <label class="layer-row"><input type="checkbox" id="layer-outlines" checked /> Outline lines (dept/aisle/rack borders)</label>
        <label class="layer-row"><input type="checkbox" id="layer-floorplan" checked /> GeoJSON departments/aisles/racks</label>
    </div>

    <div id="debug-panel">
        <h3>Debug: Live GeoJSON Adjust</h3>
        <p class="debug-hint">
            Moves/rotates/scales the actual rendered "Lowes_*.geojson" files
            in real time. Nothing is saved to disk until you copy/download.
        </p>

        <div class="debug-readout">
            <div><span>East</span><b id="dbg-east">0.0 m</b></div>
            <div><span>North</span><b id="dbg-north">0.0 m</b></div>
            <div><span>Rotation</span><b id="dbg-rotation">0.0°</b></div>
            <div><span>Scale X</span><b id="dbg-scale-x">1.000</b></div>
            <div><span>Scale Y</span><b id="dbg-scale-y">1.000</b></div>
        </div>

        <div class="debug-row">
            <label>Move step</label>
            <input type="number" id="dbg-move-step" value="1" min="0.01" step="0.5" />
            <span class="unit">m</span>
        </div>

        <div class="dpad">
            <span></span>
            <button id="dbg-move-n" title="Move north">▲</button>
            <span></span>
            <button id="dbg-move-w" title="Move west">◀</button>
            <button id="dbg-move-reset" title="Reset position">●</button>
            <button id="dbg-move-e" title="Move east">▶</button>
            <span></span>
            <button id="dbg-move-s" title="Move south">▼</button>
            <span></span>
        </div>

        <div class="debug-row">
            <label>Rotate step</label>
            <input type="number" id="dbg-rotate-step" value="5" min="0.1" step="1" />
            <span class="unit">deg</span>
        </div>
        <div class="debug-row debug-btn-row">
            <button id="dbg-rotate-ccw" title="Rotate counter-clockwise">⟲ CCW</button>
            <button id="dbg-rotate-cw" title="Rotate clockwise">⟳ CW</button>
        </div>

        <div class="debug-row">
            <label>Scale step</label>
            <input type="number" id="dbg-scale-step" value="0.02" min="0.001" step="0.01" />
        </div>
        <div class="debug-row debug-btn-row">
            <button id="dbg-scale-x-down" title="Scale X down">− Scale X</button>
            <button id="dbg-scale-x-up" title="Scale X up">+ Scale X</button>
        </div>
        <div class="debug-row debug-btn-row">
            <button id="dbg-scale-y-down" title="Scale Y down">− Scale Y</button>
            <button id="dbg-scale-y-up" title="Scale Y up">+ Scale Y</button>
        </div>

        <button id="dbg-reset-all">Reset All</button>

        <h3>Copy / save result</h3>
        <div class="debug-row">
            <select id="dbg-dataset">
                <option value="departments">departments (Lowes_depertment.geojson)</option>
                <option value="departmentLines">departmentLines (Lowes_depertment_line.geojson)</option>
                <option value="departmentPoints">departmentPoints (Lowes_depertment_point.geojson)</option>
                <option value="aisles">aisles (Lowes_aisle.geojson)</option>
                <option value="aisleLines">aisleLines (Lowes_aisle_line.geojson)</option>
                <option value="aislePoints">aislePoints (Lowes_aisle_point.geojson)</option>
                <option value="racks">racks (Lowes_rack.geojson)</option>
                <option value="rackLines">rackLines (Lowes_rack_line.geojson)</option>
            </select>
        </div>
        <div class="debug-row debug-btn-row">
            <button id="dbg-copy">Copy GeoJSON</button>
            <button id="dbg-download">Download File</button>
        </div>
        <div class="debug-row debug-btn-row">
            <button id="dbg-copy-all">Copy All 8 (bundle JSON)</button>
        </div>
        <div id="dbg-status"></div>
    </div>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script src="app.js"></script>
</body>
</html>
