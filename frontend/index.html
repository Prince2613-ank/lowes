<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lowe's Interactive Store Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="topbar">
        <div class="brand">Lowe's Store Map</div>
        <select id="store-select"></select>
        <div id="store-meta"></div>
    </div>

    <div id="map"></div>

    <div id="layer-panel">
        <h3>Layers</h3>
        <label class="layer-row"><input type="checkbox" id="layer-satellite" /> Satellite basemap</label>
        <label class="layer-row"><input type="checkbox" id="layer-aisle" checked /> Lowes_aisle</label>
        <label class="layer-row"><input type="checkbox" id="layer-rack" checked /> Lowes_rack</label>
        <label class="layer-row"><input type="checkbox" id="layer-department" checked /> Lowes_depertment</label>
    </div>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script src="app.js"></script>
</body>
</html>
